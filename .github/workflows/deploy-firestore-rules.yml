name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules.template
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          test -n "$OWNER_EMAIL" || { echo "OWNER_EMAIL secret is not set"; exit 1; }
          sed "s|__OWNER_EMAIL__|${OWNER_EMAIL}|" firestore.rules.template > firestore.rules
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}

      - run: npx --yes firebase-tools deploy --only firestore:rules --project life-boseriko-com --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

name: Deploy Firestore rules & indexes

on:
  push:
    branches: [main]
    paths:
      - firestore.rules.template
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: cp firestore.rules.template firestore.rules

      - run: npx --yes firebase-tools deploy --only firestore --project life-boseriko-com --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
